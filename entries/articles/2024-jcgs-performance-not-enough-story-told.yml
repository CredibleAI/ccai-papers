type: article
title: 'Performance Is Not Enough: The Story Told by a Rashomon Quartet'
authors:
- Przemyslaw Biecek
- Hubert Baniecki
- Mateusz Krzyzinski
- Dianne Cook
year: 2024
venue: Journal of Computational and Graphical Statistics
stage: published
tags:
- rashomon
- position-paper
summary: >-
  The usual goal of supervised learning is to find the best model, the one that
  optimizes a particular performance measure. However, what if the explanation
  provided by this model is completely different from another model and
  different again from another model despite all having similarly good fit
  statistics? Is it possible that the equally effective models put the spotlight
  on different relationships in the data? Inspired by Anscombe’s quartet, this
  article introduces a Rashomon Quartet, that is a set of four models built on a
  synthetic dataset which have practically identical predictive performance.
  However, the visual exploration reveals distinct explanations of the relations
  in the data. This illustrative example aims to encourage the use of methods
  for model visualization to compare predictive models beyond their performance.
