type: article
title: Explaining Similarity in Vision-Language Encoders with Weighted Banzhaf Interactions
authors:
- Hubert Baniecki
- Maximilian Muschalik
- Fabian Fumagalli
- Barbara Hammer
- Eyke Hüllermeier
- Przemyslaw Biecek
year: 2025
venue: NeurIPS 2025
stage: published
tags:
- xai
