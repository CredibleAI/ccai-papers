type: article
title: 'Kleister: Key Information Extraction Datasets Involving Long Documents with Complex Layouts'
authors:
- Tomasz Stanislawek
- Filip Gralinski
- Anna Wróblewska
- Dawid Lipinski
- Agnieszka Kaliska
- Paulina Rosalska
- Bartosz Topolski
- Przemyslaw Biecek
year: 2021
venue: ICDAR 2021
stage: published
summary: >-
  The relevance of the Key Information Extraction (KIE) task is increasingly
  important in natural language processing problems. But there are still only a
  few well-defined problems that serve as benchmarks for solutions in this area.
  To bridge this gap, we introduce two new datasets (Kleister NDA and Kleister
  Charity). They involve a mix of scanned and born-digital long formal
  English-language documents. In these datasets, an NLP system is expected to
  find or infer various types of entities by employing both textual and
  structural layout features. The Kleister Charity dataset consists of 2,788
  annual financial reports of charity organizations, with 61,643 unique pages
  and 21,612 entities to extract. The Kleister NDA dataset has 540
  Non-disclosure Agreements, with 3,229 unique pages and 2,160 entities to
  extract. We provide several state-of-the-art baseline systems from the KIE
  domain (Flair, BERT, RoBERTa, LayoutLM, LAMBERT), which show that our datasets
  pose a strong challenge to existing models. The best model achieved an 81.77%
  and an 83.57% F1-score on respectively the Kleister NDA and the Kleister
  Charity datasets. We share the datasets to encourage progress on more in-depth
  and complex information extraction tasks.
