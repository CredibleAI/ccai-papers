type: article
title: 'Resistance Against Manipulative AI: Key Factors and Possible Actions'
authors:
- Piotr Wilczynski
- Wiktoria Mieleszczenko-Kowszewicz
- Przemyslaw Biecek
year: 2024
venue: ECAI 2024
stage: published
tags:
- llm
